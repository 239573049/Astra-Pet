name: release

# 打 v* 标签（例如 v0.2.0、v0.3.0-preview.1）或手动触发：各平台编一份 Native AOT 的程序，冒烟通过后做成安装包，
# 上传到 LocalGate 站点（/api/pet-releases/upload），站点的 /pet 页就会出现新版本，
# 正在运行的宠物下次检测更新时会冒气泡提醒。
#
#   macOS    .dmg（Developer ID 签名；配了公证凭据就公证并钉票据），arm64 和 x64 各一个
#   Windows  .exe 安装程序（Inno Setup），x64。没有代码签名证书，首次运行会被 SmartScreen 提示
#   Linux    .deb（Debian / Ubuntu），x64
#
# 站点固定是 https://astra-gate.si（程序里的更新检测地址也是它，见 src/AstraPet.csproj 的 UpdateBaseUrl）。
# 需要在 GitHub 仓库里配置：
#   Secrets  PET_UPLOAD_TOKEN   和站点环境变量 PET_UPLOAD_TOKEN 的值一致（没配时只构建，不上传）
#   Secrets  MACOS_CERT_P12_BASE64、MACOS_CERT_PASSWORD   Developer ID Application 证书（没配时 mac 包只做 ad-hoc 签名）
#   公证（可选）：APPLE_API_KEY_P8_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID，或 APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，x.y.z（正式版）或 x.y.z-preview.N（预览版）
        required: true
        type: string
      upload:
        description: 构建后上传到站点
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      upload: ${{ steps.v.outputs.upload }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            UPLOAD="${{ inputs.upload }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            UPLOAD=true
          fi
          # 版本号规则和站点一致：x.y.z 是正式版，x.y.z-preview.N 是预览版，别的一律拒绝。
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$ ]]; then
            CHANNEL=preview
          else
            echo "::error::版本号 '$VERSION' 不合法，需要 x.y.z 或 x.y.z-preview.N"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, platform: darwin-arm64, os: macos-15 }
          - { rid: osx-x64, platform: darwin-x64, os: macos-15-intel }
          - { rid: win-x64, platform: win32-x64, os: windows-latest }
          - { rid: linux-x64, platform: linux-x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # macOS 代码签名和公证（都配了才签；没配就退回 ad-hoc 签名，用户首次打开会被 Gatekeeper 拦）
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      # 公证凭据，二选一（都没配就不公证）：
      #   A. App Store Connect API 密钥（推荐，不用 Apple ID 密码）：APPLE_API_KEY_P8_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID
      #   B. Apple ID：APPLE_ID（Secret 或 Variable）+ APPLE_APP_SPECIFIC_PASSWORD（App 专用密码）
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      # Apple ID 可以放 Secret 也可以放 Variable；专用密码的名字两种都认（LocalGate 里用的是 APPLE_APP_SPECIFIC_PASSWORD）
      APPLE_ID: ${{ secrets.APPLE_ID || vars.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # clang 和 zlib1g-dev 是 Native AOT 在 Linux 上的编译要求；nasm 和 pkg-config 用来编 ffmpeg；
        # xvfb 给冒烟测试一个虚拟显示器；libfontconfig1 等是程序运行时要加载的库（也是 .deb 的 Depends）。
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev nasm pkg-config xvfb libfontconfig1 libx11-6 libice6 libsm6

      - name: Build (Native AOT)
        shell: bash
        # 先 build 再 publish --no-build：直接 publish 开着 AOT 时，Avalonia 的 XAML 编译会被跳过，
        # App.Initialize 里的 AvaloniaXamlLoader.Load 不会被改写，程序一启动就报 “No precompiled XAML found”。
        run: |
          ARGS="-c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:Version=$VERSION"
          dotnet build src/AstraPet.csproj $ARGS
          dotnet publish src/AstraPet.csproj $ARGS --no-build -o publish

      - name: Smoke test
        shell: bash
        # 起 Avalonia 和 AtomUI、把控制台 XAML 完整加载一遍：XAML 没编进去、被裁掉的类型都会在这里暴露。
        run: |
          case "${{ runner.os }}" in
            Windows) ./publish/AstraPet.exe --smoke ;;
            Linux)   xvfb-run -a ./publish/AstraPet --smoke ;;
            *)       ./publish/AstraPet --smoke ;;
          esac

      # ── 自带 ffmpeg：宠物动画是带透明通道的 VP9，必须有带 libvpx-vp9 的 ffmpeg，不能指望用户自己装。
      #    用 tools/ffmpeg/build.sh 从官方源码构建 LGPL 精简版（几 MB，静态链接，不含 GPL 组件），按脚本内容缓存。
      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('tools/ffmpeg/build.sh') }}

      - name: Build ffmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          brew install nasm pkg-config
          tools/ffmpeg/build.sh ffmpeg-out

      - name: Build ffmpeg (Linux)
        if: runner.os == 'Linux' && steps.ffcache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/ffmpeg/build.sh ffmpeg-out

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows' && steps.ffcache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils nasm pkgconf perl tar xz curl binutils
            mingw-w64-ucrt-x86_64-gcc

      - name: Build ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffcache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: tools/ffmpeg/build.sh ffmpeg-out

      - name: Check ffmpeg
        shell: bash
        # 用真实素材跑一遍程序用到的两条命令，并确认解出来的帧带透明通道。
        run: |
          CLIP=$(find src/Assets/videos/idle -name '*.webm' | head -n 1)
          FF=ffmpeg-out/ffmpeg; [ -f ffmpeg-out/ffmpeg.exe ] && FF=ffmpeg-out/ffmpeg.exe
          tools/ffmpeg/selftest.sh "$FF" "$CLIP"

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_CERT_PASSWORD != ''
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -n 1 | sed -E 's/^[^"]*"(.*)"$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::证书里没有 'Developer ID Application' 身份。公证只认这种证书（Apple Development / Distribution 不行）。证书里现有的身份："
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "签名身份: $IDENTITY"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="stage/Astra Pet.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/. "$APP/Contents/MacOS/"
          cp ffmpeg-out/ffmpeg "$APP/Contents/MacOS/ffmpeg"
          rm -rf "$APP/Contents/MacOS/"*.dSYM
          cp src/Assets/icons/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          # 代码签名要求 Contents/MacOS 里只有可执行文件和动态库；素材和许可文本放 Contents/Resources，
          # 否则 codesign 会报 “code object is not signed at all / In subcomponent: …/licenses/…”。程序按这个位置找（见 Program.ResolveVideosDir）。
          mv "$APP/Contents/MacOS/Assets" "$APP/Contents/Resources/Assets"
          mv "$APP/Contents/MacOS/licenses" "$APP/Contents/Resources/licenses"
          # 此时 MacOS 里应该只剩 Mach-O 文件，多了别的就在这里停下，别等到签名才报错
          if find "$APP/Contents/MacOS" -type f ! \( -name AstraPet -o -name ffmpeg -o -name "*.dylib" \) | grep -q .; then
            echo "::error::Contents/MacOS 里有不是可执行文件或动态库的东西："
            find "$APP/Contents/MacOS" -type f ! \( -name AstraPet -o -name ffmpeg -o -name "*.dylib" \)
            exit 1
          fi
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Astra Pet</string>
            <key>CFBundleDisplayName</key><string>Astra Pet</string>
            <key>CFBundleIdentifier</key><string>ai.astra.pet</string>
            <key>CFBundleExecutable</key><string>AstraPet</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          DMG="AstraPet-$VERSION-${{ matrix.platform }}.dmg"
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            # Developer ID 签名。公证要求每个 Mach-O 都签、开 hardened runtime、带时间戳；由内到外：动态库和 ffmpeg，主程序，最后是 .app。
            SIGN=(codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY")
            find "$APP/Contents/MacOS" -type f \( -name "*.dylib" -o -name ffmpeg \) -exec "${SIGN[@]}" {} \;
            "${SIGN[@]}" "$APP/Contents/MacOS/AstraPet"
            "${SIGN[@]}" "$APP"
            codesign --verify --strict --verbose=2 "$APP"
            # 先公证并钉好 .app 本身（装进「应用程序」后离线也能通过检查），再做 dmg，dmg 也签名、公证、钉票据。
            tools/package/notarize.sh "$APP"
            tools/package/make_dmg.sh "$APP" "$DMG"
            "${SIGN[@]}" "$DMG"
            tools/package/notarize.sh "$DMG"
          else
            # 没有开发者证书，做 ad-hoc 签名：Apple 芯片上未签名的程序根本跑不起来。用户首次打开会被 Gatekeeper 拦。
            codesign --force --deep --sign - "$APP"
            tools/package/make_dmg.sh "$APP" "$DMG"
          fi

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Copy-Item ffmpeg-out/ffmpeg.exe publish/ffmpeg.exe

          # Inno Setup：windows-latest 镜像里通常已经有，没有就用 choco 装
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe') { if (Test-Path $p) { $iscc = $p; break } }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          Write-Host "ISCC: $iscc"

          # 文件属性里的版本必须是 x.y.z.w 四段数字：去掉 -preview.N，补 .0
          $numeric = ($env:VERSION -replace '-.*$', '') + '.0'
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$numeric" "/DSourceDir=$PWD\publish" "/DOutputDir=$PWD" "/DOutputName=AstraPet-$env:VERSION-${{ matrix.platform }}" installer\windows\AstraPet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败 ($LASTEXITCODE)" }

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DEB="AstraPet-$VERSION-${{ matrix.platform }}.deb"
          tools/package/make_deb.sh publish ffmpeg-out/ffmpeg "$VERSION" "$DEB"
          dpkg-deb --contents "$DEB" | grep -E "opt/astra-pet/(AstraPet|ffmpeg)$|\.desktop$|astra-pet.png$"

          # 真的装一遍再跑冒烟：依赖能解析、文件装到了该去的地方、程序在安装位置找得到素材和 ffmpeg。
          sudo apt-get install -y "./$DEB"
          test -x /usr/bin/astra-pet
          test -f /usr/share/applications/astra-pet.desktop
          xvfb-run -a /opt/astra-pet/AstraPet --smoke
          /opt/astra-pet/ffmpeg -hide_banner -decoders 2>/dev/null | grep -q libvpx-vp9

      - uses: actions/upload-artifact@v4
        with:
          name: AstraPet-${{ matrix.platform }}
          path: |
            AstraPet-*.dmg
            AstraPet-*.exe
            AstraPet-*.deb
          if-no-files-found: error

  upload:
    needs: [meta, build]
    if: needs.meta.outputs.upload == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      SITE: https://astra-gate.si
      TOKEN: ${{ secrets.PET_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to LocalGate
        shell: bash
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::没有配置 PET_UPLOAD_TOKEN（Secrets），跳过上传。构建产物在本次运行的 Artifacts 里。"
            exit 0
          fi

          # 版本说明：上一个标签到这次之间的提交标题。
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "HEAD^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          NOTES=$(git log --no-merges --pretty='- %s' $RANGE | head -n 50)
          NOTES_B64=$(printf '%s' "$NOTES" | base64 | tr -d '\n')

          for FILE in dist/AstraPet-*; do
            NAME=$(basename "$FILE")
            # 文件名是 AstraPet-<版本>-<平台>.<扩展名>，扩展名就是站点上的 kind（dmg / exe / deb）
            REST=${NAME#AstraPet-$VERSION-}
            KIND=${REST##*.}
            PLATFORM=${REST%.*}
            echo "上传 $NAME（$PLATFORM，$KIND）"
            curl --fail-with-body -sS -X POST "$SITE/api/pet-releases/upload" \
              -H "Authorization: Bearer $TOKEN" \
              -H "x-astra-version: $VERSION" \
              -H "x-astra-channel: $CHANNEL" \
              -H "x-astra-platform: $PLATFORM" \
              -H "x-astra-kind: $KIND" \
              -H "x-astra-notes-b64: $NOTES_B64" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" -o response.json
            # 站点返回它自己算的 sha256，和本地文件核对，防止传了一半或被中间人改过。
            LOCAL=$(sha256sum "$FILE" | cut -d' ' -f1)
            REMOTE=$(python3 -c "import json;print(json.load(open('response.json'))['file']['sha256'])")
            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "::error::$NAME 的 sha256 对不上：本地 $LOCAL，站点 $REMOTE"
              exit 1
            fi
          done
          echo "已上传 $VERSION（$CHANNEL）：$SITE/pet"
